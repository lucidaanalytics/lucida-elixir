name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_HEX: ${{ secrets.HEX_API_KEY != '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - run: mix local.hex --force && mix hex.build -o lucida.tar
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: lucida.tar
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lucida.tar --generate-notes --verify-tag
      # Hex has no OIDC publishing: the publish runs only when the HEX_API_KEY repository secret is set.
      - name: Publish to Hex
        if: env.HAS_HEX == 'true'
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
